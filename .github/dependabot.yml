# Dependency updates arrive as PRs and must pass the full CI gate (scans included) before merge.
# A cooldown waits a few days after an upstream release, so a hijacked release has time to be
# detected and yanked before it is proposed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    # Every service and the template it is generated from (one grouped PR keeps them identical).
    directories: ["/", "/apps/*", "/platform/templates/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/apps/*", "/platform/templates/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Python 3.13 is the project standard (ADR 0006). Digest refreshes of python:3.13-slim (OS and
    # Python patch releases) are still proposed; a minor/major jump such as 3.13 -> 3.15 is not.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: terraform
    directories: ["/terraform/stack", "/terraform/bootstrap"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
