# Apply EXACTLY a reviewed Terraform plan to an environment (Phase 4).
#
#   1. Run terraform-plan.yml and review its summary. Copy the plan digest.
#   2. Run this workflow with that digest.
#   3. Approve the `dev` environment (required reviewer). Only then is the apply role
#      (`idp-dev-github-apply`, trust = environment:dev) available to the job.
#   4. The job re-plans and REFUSES to apply unless the new plan's digest equals the reviewed one,
#      so a change in code, variables or real infrastructure after review stops the apply.
name: terraform-apply

# checkov:skip=CKV_GHA_7:plan_digest is not a build parameter: it is the reviewed-plan gate; it changes nothing that runs, it only makes the job refuse when the plan differs.
on:
  workflow_dispatch:
    inputs:
      plan_digest:
        description: Plan digest from the reviewed terraform-plan run (64 hex characters)
        type: string
        required: true

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  apply:
    name: terraform apply (dev, approved)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45 # includes waiting for ECS steady state
    environment: dev # required reviewer approves before this job receives credentials
    permissions:
      contents: read
      id-token: write # OIDC: the apply role trusts only environment:dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ALLOWED_INGRESS_CIDR: ${{ vars.ALLOWED_INGRESS_CIDR }}
      SERVICE_IMAGE_DIGEST: ${{ vars.SERVICE_IMAGE_DIGEST }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      EXPECTED_DIGEST: ${{ inputs.plan_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install manifest renderer dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.3
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: idp-dev-apply-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Verify digest, then apply the reviewed plan
        run: scripts/tf_ci.sh apply dev
