# Build, test, scan and publish the sample-api image to ECR (Phase 5).
#
#   - Runs only on main (after a reviewed, CI-green pull request: branch ruleset) or manually on main.
#   - Builds, runs the hardened smoke test and the Trivy gate BEFORE any AWS credentials exist.
#   - Then assumes the image-push role (`idp-github-image-push`, trust = ref:refs/heads/main). That
#     role can push to idp/* repositories and nothing else, and the repository policy denies pushes
#     by any other principal. It cannot deploy: deploying is app-deploy.yml, behind an approval.
#   - Tag `git-<commit>` is immutable (ECR); the job publishes the image DIGEST, which is what
#     app-deploy.yml and Terraform accept. Tags are never deployed.
#   - A CycloneDX SBOM of the scanned image is kept as a run artifact (no secrets in it).
name: image-build

on:
  push:
    branches: [main]
    paths:
      - "apps/sample-api/**"
      - ".github/workflows/image-build.yml"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: image-build-${{ github.sha }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.76.2
  IMAGE: sample-api:build
  ECR_REPOSITORY: idp/sample-api

jobs:
  build:
    name: build, smoke, scan, push (sample-api)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # OIDC: the image-push role trusts only ref:refs/heads/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: make image
      - name: Smoke test (read-only FS, no capabilities, UID 10001, graceful stop)
        run: make smoke
      - name: Trivy image gate (HIGH/CRITICAL with a fix available fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-sample-api-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: idp-image-push-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Push by immutable tag, publish the digest
        run: scripts/push_image.sh
      - name: Log out of ECR
        if: always()
        run: docker logout "$(cat "$RUNNER_TEMP/registry" 2>/dev/null || echo none)" >/dev/null 2>&1 || true
