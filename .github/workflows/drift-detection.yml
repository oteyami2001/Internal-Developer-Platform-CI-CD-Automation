# Weekly drift detection for dev (Phase 7).
#
#   - Read-only: runs in `dev-plan` with the plan role (no write access to infrastructure) and
#     `scripts/tf_ci.sh drift`, which plans and NEVER applies.
#   - Drift is reported, not fixed: it opens (or comments on) an issue labelled `drift` listing
#     resource addresses and actions only (no values: issues are public), and the run fails so the
#     owner is notified. Resolution goes through a pull request or the reviewed plan/apply flow
#     (docs/rollback-runbook.md section 5).
name: drift-detection

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: terraform-dev # never overlaps a plan, apply or cleanup of the same state
  cancel-in-progress: false

jobs:
  drift:
    name: drift detection (dev)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev-plan
    permissions:
      contents: read
      id-token: write # OIDC: the read-only plan role trusts only environment:dev-plan
      issues: write # open or update the drift issue
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      ALLOWED_INGRESS_CIDR: ${{ secrets.ALLOWED_INGRESS_CIDR }}
      SERVICE_IMAGE_DIGEST: ${{ vars.SERVICE_IMAGE_DIGEST }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install manifest renderer dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.3
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: idp-dev-drift-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Plan (read-only) and compare with real infrastructure
        id: drift
        run: |
          rc=0
          scripts/tf_ci.sh drift dev || rc=$?
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
      - name: Open or update the drift issue
        if: steps.drift.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/report_drift.sh dev "$RUNNER_TEMP/drift.md"
      - name: Fail the run so the owner is notified (nothing was changed)
        if: steps.drift.outputs.rc == '3'
        run: |
          echo "::error::Drift detected in dev. See the drift issue. Nothing was changed."
          exit 1
