[project]
name = "internal-developer-platform"
version = "0.1.0"
description = "Self-service Internal Developer Platform on AWS (ECS Fargate, Terraform, GitHub Actions)"
requires-python = ">=3.13,<3.14" # project standard: Python 3.13 (ADR 0006)

[tool.pytest.ini_options]
testpaths = ["apps/sample-api/tests", "tests"]
pythonpath = ["apps/sample-api", "scripts"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["app", "validate_service", "generate_catalog"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR0913"]

[tool.bandit]
exclude_dirs = ["tests", "apps/sample-api/tests", ".venv"]
